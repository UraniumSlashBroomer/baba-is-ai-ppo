name: make_win
env_id: env/make_win
# Optional multi-task training. When env_ids is set, a new env is sampled
# uniformly on every episode reset. All envs must share obs/action shapes.
# env_ids:
#   - env/two_room-break_stop-goto_win
#   - env/two_room-make_win
# eval_env_id: env/two_room-break_stop-make_win
seed: 0
device: cpu

# cnn keeps the previous feed-forward PPO. lstm enables recurrent PPO.
model_type: cnn

total_steps: 1000000
rollout_steps: 10000
max_episode_steps: 128

gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5

learning_rate: 0.00015
update_epochs: 4
minibatch_size: 256

hidden_size: 256
use_idle: false
use_coord_channels: true
use_shaped_reward: false
boundary_penalty: -0.01
use_stuck_push_penalty: true
stuck_push_penalty: -0.01
rule_assembly_reward: 0.3
rule_dead_penalty: -0.5
dead_rule_positions:
  env/make_win:
    object:
      - [4, 6]
      - [5, 6]
      - [6, 1]
      - [6, 2]
      - [6, 3]
      - [6, 4]
      - [6, 5]
      - [6, 6]
      - [4, 1]
      - [5, 1]
warmup_episode_ratio: 0.0
warmup_seed: 11
checkpoint_every: 10
save_every: false
save_every_n_steps: 100000
eval_episodes: 20
sample_episodes: 10
train_render_fps: 300
eval_render_fps: 30
